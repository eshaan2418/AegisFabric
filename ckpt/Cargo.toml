[package]
name = "aegis-ckpt"
version = "0.1.0"
edition = "2021"
description = "AegisFabric crash-consistent content-addressed checkpoint store"

[[bin]]
name = "aegis-ckpt"
path = "src/main.rs"

[lib]
name = "aegis_ckpt"
path = "src/lib.rs"

[dependencies]
rocksdb = { version = "*", default-features = false }
blake3 = "1"
crc32c = "0.6"
serde_json = "1"
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
