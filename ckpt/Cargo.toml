[package]
name = "aegis-ckpt"
version = "0.1.0"
edition = "2021"
description = "AegisFabric checkpoint engine: content-addressed, deduplicating, crash-consistent chunk store (protocol P1)"
license = "MIT"

[lib]
name = "aegis_ckpt"
path = "src/lib.rs"

[[bin]]
name = "aegis-ckpt"
path = "src/main.rs"

[dependencies]
blake3 = "1"
crc32c = "0.6"
rocksdb = { version = "0.22", default-features = false, features = ["lz4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
io-uring = "0.7"

[dev-dependencies]
tempfile = "3"
rand = "0.8"

[features]
# Mutation switch for the tests: disables the COMMIT/PUT epoch refresh (the TLC-found P1 bug).
# `cargo test --release --features bug-no-epoch-refresh --test store` must FAIL the GC interleaving tests.
bug-no-epoch-refresh = []

[profile.release]
debug = 1
